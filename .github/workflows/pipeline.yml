name: Daily data pipeline

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC (05:00/06:00 in Egypt)
  workflow_dispatch:       # allows a manual run from the Actions tab
  push:
    branches: [main]
    paths: ["energy_pipeline/**", "tests/**", "config.toml", "requirements.txt"]

permissions:
  contents: write          # needed to commit the refreshed data back to the repo

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        run: python -m energy_pipeline

      - name: Commit refreshed data
        if: always()       # also commit the run log when the pipeline fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: automated refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
